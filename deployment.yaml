apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-hello-world
  template:
    metadata:
      labels:
        app: java-hello-world
    spec:
      containers:
      - name: java-app
        image: ghcr.io/sraone-1999/java-hello-world:94d84f871b672d91b05500f58b612ea893585b9e
        ports:
        - containerPort: 8080
