apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-hello-world
  template:
    metadata:
      labels:
        app: java-hello-world
    spec:
      containers:
      - name: java-app
        image: ghcr.io/sraone-1999/java-hello-world:89bd0a1ef8aab9ec2ed8891fd7152454290a1bf2
        ports:
        - containerPort: 8080
