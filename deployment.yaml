apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-hello-world
  template:
    metadata:
      labels:
        app: java-hello-world
    spec:
      containers:
      - name: java-app
        image: ghcr.io/sraone-1999/java-hello-world:5eb6b3c60349b89b0b3bcf6c9ad798ab5c831f2c
        ports:
        - containerPort: 8080
