apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-hello-world
  template:
    metadata:
      labels:
        app: java-hello-world
    spec:
      containers:
      - name: java-app
        image: ghcr.io/sraone-1999/java-hello-world:cd325a2faef243b780e8de751c29f6179d1fb287
        ports:
        - containerPort: 8080
